<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
      <linearGradient id="bgGrad_screen-1" x1="88%" y1="18%" x2="12%" y2="82%">
        <stop offset="0%" stop-color="#0284c7" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>
    
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1920" fill="url(#bgGrad_screen-1)" />

  <!-- Shapes & Badges (Background Layers) -->
  
      <g transform="translate(540, 95) rotate(0) scale(1)">
        <rect x="-240" y="-30" width="480" height="60" rx="30" ry="30"
              fill="#ffffff" stroke="none" stroke-width="0"
              filter="url(#badgeShadow)" />
        <text x="0" y="6" text-anchor="middle" dominant-baseline="middle"
              fill="#0284c7" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700">
          🎮 لعبة أركيد إدمانية وممتعة
        </text>
        
      </g>
    

  <!-- Device Mockup Frame -->
  
      <g transform="translate(540, 1180) rotate(2) scale(0.94)">
        <!-- Phone Drop Shadow -->
        <rect x="-336" y="-682" width="680" height="1400" rx="58" ry="58" fill="rgba(0,0,0,0.35)" filter="url(#dropShadow)" />
        <!-- Phone Outer Chassis -->
        <rect x="-340" y="-700" width="680" height="1400" rx="58" ry="58" fill="#0f172a" stroke="#334155" stroke-width="3" />
        <!-- Phone Screen Glass -->
        <rect x="-318" y="-678" width="636" height="1356" rx="44" ry="44" fill="#0b0f19" />
        <!-- Screen Content Mockup Lines -->
        <rect x="-288" y="-618" width="576" height="140" rx="16" fill="rgba(255,255,255,0.08)" />
        <rect x="-288" y="-448" width="576" height="80" rx="12" fill="rgba(255,255,255,0.05)" />
        <rect x="-288" y="-348" width="576" height="80" rx="12" fill="rgba(255,255,255,0.05)" />
        <rect x="-288" y="-248" width="576" height="260" rx="16" fill="rgba(255,255,255,0.06)" />
        <!-- Punch-hole Selfie Camera -->
        <circle cx="0" cy="-674" r="10" fill="#030712" stroke="#1f2937" stroke-width="1.5" />
        <!-- Glass Screen Glare Reflection -->
        <path d="M -318 -678 L 318 -458 L 318 -678 Z" fill="rgba(255,255,255,0.03)" />
      </g>
    

  <!-- Headline Text -->
  <text x="540" y="155" text-anchor="middle"
        direction="rtl"
        fill="#ffffff" font-family="Cairo, system-ui, sans-serif"
        font-size="66" font-weight="800" letter-spacing="-1">
    <tspan x="540" dy="0">انقر وحلق وتحدى السماء</tspan>
  </text>

  <!-- Subtitle Text -->
  <text x="540" y="340" text-anchor="middle"
        direction="rtl"
        fill="#bae6fd" font-family="Cairo, system-ui, sans-serif"
        font-size="32" font-weight="400">
    <tspan x="540" dy="0">مغامرة أركيد كلاسيكية سريعة بمهارات</tspan>
    <tspan x="540" dy="43.2">حديثة وممتعة.</tspan>
  </text>
</svg>