<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppScreen Studio - Google Play Screenshot Generator</title>
  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" />
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=42" />
  <link rel="stylesheet" href="css/components.css?v=42" />
</head>
<body>

  <!-- Top Studio Header -->
  <header class="app-header">
    <div class="header-left">
      <a href="./" class="btn btn-outline btn-sm" title="All projects"><span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span> Projects</a>
      <input type="text" id="project-name-input" class="header-project-input" value="My Play Store App" title="Click to rename project" aria-label="Project name" />
      <span id="save-status" class="text-xs text-slate-400" aria-live="polite"></span>
    </div>

    <div class="header-right">
      <div class="canvas-zoom-controls">
        <button class="zoom-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><span class="material-symbols-outlined" style="font-size:18px;">undo</span></button>
        <button class="zoom-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo"><span class="material-symbols-outlined" style="font-size:18px;">redo</span></button>
      </div>

      <button class="zoom-btn header-icon-btn" id="btn-settings" title="Settings" aria-label="Settings"><span class="material-symbols-outlined" style="font-size:18px;">settings</span></button>

      <details class="export-menu" id="export-menu">
        <summary class="btn btn-primary btn-sm" id="export-menu-btn"><span class="material-symbols-outlined" style="font-size:16px;">download</span> Export <span class="material-symbols-outlined" style="font-size:16px;">arrow_drop_down</span></summary>
        <div class="export-menu-panel" role="menu">
          <button type="button" role="menuitem" data-export="png"><span>Current screen</span> <small>PNG</small></button>
          <button type="button" role="menuitem" data-export="jpg"><span>Current screen</span> <small>JPEG</small></button>
          <button type="button" role="menuitem" data-export="all"><span>All screens (<b id="export-all-count">4</b>)</span> <small>PNG</small></button>
          <button type="button" role="menuitem" data-export="feature"><span>Feature graphic</span> <small>1024×500 JPEG</small></button>
          <button type="button" role="menuitem" data-export="all-langs"><span>All languages (<b id="export-langs-count">1</b>)</span> <small>PNG</small></button>
          <button type="button" role="menuitem" data-export="json"><span>Project backup</span> <small>JSON</small></button>
        </div>
      </details>
    </div>
  </header>

  <!-- Settings Dialog -->
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <h3 id="settings-title" class="settings-title">Settings</h3>
      <div class="form-group">
        <label class="form-label" for="settings-theme-select">Interface theme</label>
        <select id="settings-theme-select" class="form-select"></select>
      </div>

      <fieldset class="settings-section">
        <legend class="form-label">AI translation</legend>
        <div class="form-group">
          <label class="form-label" for="ai-provider">Provider</label>
          <select id="ai-provider" class="form-select">
            <option value="gemini">Gemini (Google)</option>
            <option value="claude">Claude (Anthropic)</option>
            <option value="openai">ChatGPT (OpenAI)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="ai-key">API key</label>
          <div class="flex gap-2">
            <input type="password" id="ai-key" class="form-input flex-1" autocomplete="off" spellcheck="false" placeholder="Paste your API key" />
            <button type="button" class="btn btn-primary btn-sm" id="ai-verify">Verify</button>
          </div>
          <p class="text-xs text-slate-400 mt-1" id="ai-key-hint"></p>
        </div>
        <div class="form-group hidden" id="ai-model-group">
          <label class="form-label" for="ai-model">Model</label>
          <select id="ai-model" class="form-select"></select>
        </div>
        <p class="ai-status" id="ai-status" role="status" aria-live="polite"></p>
        <button type="button" class="btn btn-outline btn-xs hidden" id="ai-remove">Remove key</button>
      </fieldset>

      <div class="settings-actions">
        <button class="btn btn-primary btn-sm">Done</button>
      </div>
    </form>
  </dialog>

  <!-- Studio Main Layout: Left Dock + Left Drawer + Viewport + Right Inspector -->
  <main class="studio-main-layout">

    <!-- 1. Left Dock (Icons) -->
    <nav class="left-nav-dock" id="left-nav-dock"></nav>

    <!-- 2. Left Quick Drawer (Spacious Step-by-Step Panel) -->
    <aside class="left-quick-drawer" id="left-quick-drawer"></aside>

    <!-- 3. Center Canvas Viewport -->
    <section class="canvas-viewport-container">
      <div class="viewport-top-bar">
        <div class="flex items-center gap-2">
          <select class="form-select lang-switch" id="lang-switch" title="Language copy you're editing" aria-label="Language copy"></select>
          <button class="btn btn-outline btn-sm" id="btn-toggle-overview" title="Show all screens side by side"><span class="material-symbols-outlined" style="font-size:16px;">grid_view</span> All Screens</button>
          <span class="text-xs font-semibold text-slate-400" id="viewport-hint">Drag &amp; resize items on the canvas</span>
        </div>

        <label class="overview-size hidden" id="overview-size">
          <span class="text-xs text-slate-400">Size</span>
          <input type="range" class="form-range" id="overview-size-range" min="160" max="900" step="20" value="520" aria-label="Preview size" />
        </label>

        <div class="canvas-zoom-controls" id="canvas-zoom-group">
          <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out" aria-label="Zoom Out"><span class="material-symbols-outlined" style="font-size:16px;">remove</span></button>
          <span class="zoom-level-text" id="zoom-level-text">100%</span>
          <button class="zoom-btn" id="btn-zoom-in" title="Zoom In" aria-label="Zoom In"><span class="material-symbols-outlined" style="font-size:16px;">add</span></button>
          <button class="zoom-btn" id="btn-zoom-fit" title="Fit to Viewport"><span class="material-symbols-outlined" style="font-size:16px;">fit_screen</span> Fit</button>
        </div>
      </div>

      <!-- Canvas Stage Wrapper -->
      <div class="canvas-stage-wrapper" id="canvas-stage-wrapper">
        <canvas id="main-app-canvas" width="1080" height="1920"></canvas>
      </div>

      <!-- All-screens overview (replaces the stage while open) -->
      <div class="overview-container hidden" id="overview-container">
        <div class="overview-scroll"></div>
      </div>

      <!-- Bottom Filmstrip Screen Carousel -->
      <footer class="bottom-screen-strip" id="bottom-screen-strip"></footer>
    </section>

    <!-- 4. Right Inspector Sidebar (Clean Contextual Properties) -->
    <aside class="studio-inspector-sidebar" id="studio-inspector-sidebar"></aside>

  </main>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js?v=42"></script>
</body>
</html>
